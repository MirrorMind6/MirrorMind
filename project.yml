name: MirrorMind
options:
  bundleIdPrefix: com.mirrormind
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.2"
  defaultConfig: Debug

targets:
  MirrorMind:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MirrorMind
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mirrormind.app
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: MirrorMind/Info.plist
      properties:
        CFBundleDisplayName: MirrorMind
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
